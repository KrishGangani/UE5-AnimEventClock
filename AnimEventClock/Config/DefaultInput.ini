; P06 AnimEventClock - input configuration.
; Only the two keys Epic's 5.8 TP_Blank template sets (Templates/TP_Blank/Config/DefaultInput.ini:79-80). Without them
; the engine creates the classic UPlayerInput, and the default-enabled Enhanced Input plugin warns at startup that its
; local-player subsystem has "no valid PlayerInput object" (seen in the UE5-SpawnPacer Phase 4 smoke run). This project
; reads no input.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
